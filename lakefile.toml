name = "lean4-nlp"
version = "0.1.0"
description = "Algebra-first classical natural-language processing in Lean 4"
keywords = ["nlp", "formal-methods", "dynamic-programming", "lean"]
homepage = "https://github.com/mepuka/lean4-nlp"
defaultTargets = ["NlpCore"]
precompileModules = false

[[lean_lib]]
name = "NlpCore"
srcDir = "."
roots = ["Nlp"]

[[lean_lib]]
name = "NlpTests"
srcDir = "."
roots = ["NlpTests"]

[[lean_exe]]
name = "parallel-benchmark"
root = "Bench.Parallel"

[[lean_exe]]
name = "tokenize-benchmark"
root = "Bench.Tokenize"
