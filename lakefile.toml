name = "lean4-nlp"
version = "0.1.0"
description = "Algebra-first classical natural-language processing in Lean 4"
keywords = ["nlp", "formal-methods", "dynamic-programming", "lean"]
homepage = "https://github.com/mepuka/lean4-nlp"
defaultTargets = ["NlpCore"]
precompileModules = false

[[lean_lib]]
name = "NlpCore"
srcDir = "."
roots = ["Nlp"]

[[lean_lib]]
name = "NlpTests"
srcDir = "."
roots = ["NlpTests"]

[[lean_exe]]
name = "parallel-benchmark"
root = "Bench.Parallel"

[[lean_exe]]
name = "tokenize-benchmark"
root = "Bench.Tokenize"

[[lean_exe]]
name = "morphology-benchmark"
root = "Bench.Morphology"

[[lean_exe]]
name = "pos-benchmark"
root = "Bench.Pos"

[[lean_exe]]
name = "unary-benchmark"
root = "Bench.Unary"

[[lean_exe]]
name = "compiled-viterbi-benchmark"
root = "Bench.CompiledViterbi"

[[lean_exe]]
name = "dependency-benchmark"
root = "Bench.Dependency"

[[lean_exe]]
name = "ner-benchmark"
root = "Bench.Ner"

[[lean_exe]]
name = "constituency-benchmark"
root = "Bench.Constituency"
